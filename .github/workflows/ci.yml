name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust and package (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop --command cargo fmt --check
      - run: nix develop --command cargo fmt --manifest-path tests/macos-seatbelt/Cargo.toml --check
      - run: nix develop --command nixfmt --check flake.nix tests/nixos.nix
      - run: nix develop --command cargo test --locked
      - run: nix develop --command cargo test --locked gateway::tls -- --include-ignored
      - name: Read-only GitHub CLI configuration
        run: |
          gh_path=$(command -v gh)
          SLOPBOX_TEST_GH="$gh_path" nix develop --command cargo test --locked \
            github::tests::gh_reads_generated_config_without_migration -- --exact --ignored
      - run: nix develop --command cargo clippy --locked --all-targets -- -D warnings
      - if: runner.os == 'macOS'
        run: nix develop --command cargo clippy --manifest-path tests/macos-seatbelt/Cargo.toml --locked --all-targets -- -D warnings
      - run: nix build -L
      - run: nix flake check --no-build --all-systems

  e2e-nixless:
    name: Linux enforcement (without Nix)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install distro dependencies
        run: |
          test ! -e /nix
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap curl git cmake pkg-config openssh-client openssl python3-venv
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: /usr/bin/python3 tests/linux-nixless.py target/debug/slopbox
      - run: /usr/bin/python3 tests/linux-bundles.py target/debug/slopbox
      - name: Prepare a disposable harness installation
        run: |
          /usr/bin/python3 -m venv "$HOME/slopbox-harness-fixture"
          "$HOME/slopbox-harness-fixture/bin/pip" install aider-chat==0.86.2
          TIKTOKEN_CACHE_DIR="$HOME/slopbox-harness-fixture/tiktoken" \
            "$HOME/slopbox-harness-fixture/bin/python" -c 'import tiktoken; tiktoken.encoding_for_model("gpt-4o")'
      - run: /usr/bin/python3 tests/linux-harness.py target/debug/slopbox "$HOME/slopbox-harness-fixture"
      - name: Prepare a disposable native Claude Code installation
        run: |
          directory="$HOME/slopbox-claude-fixture"
          mkdir -p "$directory/versions"
          curl --fail --location --retry 3 \
            https://downloads.claude.ai/claude-code-releases/2.1.283/linux-x64/claude \
            -o "$directory/versions/2.1.283"
          printf '%s  %s\n' 1859583ce32920595c61ef868bee52e1b1594f7486db209935e01f1e5e804ae2 \
            "$directory/versions/2.1.283" | sha256sum --check
          chmod 755 "$directory/versions/2.1.283"
          ln -s versions/2.1.283 "$directory/claude"
      - run: /usr/bin/python3 tests/claude-harness.py target/debug/slopbox "$HOME/slopbox-claude-fixture/claude"

  e2e-host:
    name: Linux enforcement (Ubuntu with Nix)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Require a non-NixOS host layout
        run: |
          test ! -e /run/current-system
          for path in /bin/sh /usr/bin/env; do
            case "$(readlink -f "$path")" in /nix/store/*) exit 1;; esac
          done
      - run: nix --extra-experimental-features 'nix-command flakes' run -L .#e2e

  e2e:
    name: Linux enforcement (NixOS VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#checks.x86_64-linux.e2e
